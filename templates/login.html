<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Brentwood Assistant</title>
<!-- Same theme rule as the app: follow the OS unless the student chose one
     with the sidebar toggle (saved as localStorage "theme"). -->
<script>
  (function () {
    try {
      var theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  })();
</script>
<style>
:root{--bg:#0f0f11;--box:#171719;--line:#303034;--line-focus:#68686e;--text:#ececee;--btn:#28282c;--btn-hover:#38383e;--btn-text:#d4d4da;--btn-text-hover:#fff;--focus:#96969e;--red:#c8102e;--scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#ffffff;--box:#f5f5f7;--line:#cfcfd4;--line-focus:#8a8d94;--text:#1a1a1d;--btn:#e3e3e7;--btn-hover:#d6d6db;--btn-text:#3a3a40;--btn-text-hover:#000;--focus:#6b6e75;--scheme:light}}
:root[data-theme="light"]{--bg:#ffffff;--box:#f5f5f7;--line:#cfcfd4;--line-focus:#8a8d94;--text:#1a1a1d;--btn:#e3e3e7;--btn-hover:#d6d6db;--btn-text:#3a3a40;--btn-text-hover:#000;--focus:#6b6e75;--scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);min-height:100svh;display:grid;place-items:center;padding:28px;color:var(--text);color-scheme:var(--scheme)}
form{display:flex;align-items:center;width:min(100%,320px);height:58px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--box);transition:border-color .18s}
form:focus-within{border-color:var(--line-focus)}
form.invalid{border-color:var(--red)}
input{min-width:0;flex:1;width:100%;height:100%;padding:0 14px;background:transparent;border:0;outline:none;color:var(--text);font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:5px}
button{display:grid;place-items:center;flex:none;width:44px;height:44px;padding:0;border:0;border-radius:9px;background:var(--btn);color:var(--btn-text);cursor:pointer;transition:background .18s,color .18s}
button:hover{background:var(--btn-hover);color:var(--btn-text-hover)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
svg{width:20px;height:20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<form method="post" action="/login" {% if error %}class="invalid"{% endif %}>
<label class="sr-only" for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="off" maxlength="256" required autofocus {% if error %}aria-invalid="true" aria-describedby="error"{% endif %}>
{% if error %}<span class="sr-only" id="error" role="alert">{{ error }}</span>{% endif %}
<button type="submit" aria-label="Continue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>
</body>
</html>
