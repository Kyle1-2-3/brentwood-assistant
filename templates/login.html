<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>Sign in · Brentwood Assistant</title>
<!-- Same theme rule as the app: follow the OS unless the student chose one
     with the sidebar toggle (saved as localStorage "theme"). -->
<script>
  (function () {
    try {
      var theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  })();
</script>
<style>
  /* Tokens mirror static/index.html so the gate matches the app behind it. */
  :root {
    --bg: #0f0f11; --bg-2: #151517; --bg-3: #1c1c1f;
    --text: #ececee; --muted: #9b9ea6; --dim: #6b6e75;
    --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.16);
    --red: #c8102e; --red-hover: #d9203d; --warn: #ff7a6e;
    --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--line-strong);
    --scheme: dark;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ffffff; --bg-2: #f5f5f7; --bg-3: #ebebee;
      --text: #1a1a1d; --muted: #5c5f66; --dim: #8a8d94;
      --line: rgba(0,0,0,0.08); --line-strong: rgba(0,0,0,0.16);
      --warn: #c0392b; --scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-2: #f5f5f7; --bg-3: #ebebee;
    --text: #1a1a1d; --muted: #5c5f66; --dim: #8a8d94;
    --line: rgba(0,0,0,0.08); --line-strong: rgba(0,0,0,0.16);
    --warn: #c0392b; --scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh; display: grid; place-items: center; padding: 28px 16px;
    background: var(--bg); color: var(--text); color-scheme: var(--scheme);
    font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 26px; text-align: center; }
  .brand img { width: 56px; height: 56px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; line-height: 1.2; }
  .lead { color: var(--muted); font-size: 14px; margin: 0; max-width: 32ch; }
  label.field { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 6px; }
  input[type="password"] {
    display: block; width: 100%; min-height: 48px; padding: 12px 14px;
    border: 1px solid var(--line-strong); border-radius: 4px; outline: none;
    background: var(--bg-2); color: var(--text); font: 16px var(--font);
    transition: border-color 0.15s ease;
  }
  input[type="password"]:focus { border-color: var(--red); }
  input[aria-invalid="true"] { border-color: var(--warn); }
  .error { color: var(--warn); font-size: 13px; margin: 8px 0 0; }
  .remember { display: flex; align-items: center; gap: 10px; margin: 16px 0 0; font-size: 14px; color: var(--muted); cursor: pointer; }
  .remember input { width: 18px; height: 18px; margin: 0; accent-color: var(--red); cursor: pointer; }
  button {
    width: 100%; min-height: 46px; margin-top: 18px; border: 0; border-radius: 4px;
    background: var(--red); color: #fff; font: 600 15px var(--font); cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
  }
  button:hover { background: var(--red-hover); }
  button:active { transform: scale(0.985); }
  input:focus-visible, button:focus-visible { outline: none; box-shadow: var(--focus); }
  .foot { border-top: 1px solid var(--line); margin-top: 28px; padding-top: 16px; font-size: 12.5px; color: var(--dim); text-align: center; line-height: 1.5; }
</style>
</head>

    <h1>Brentwood Assistant</h1>
    <p class="lead">Enter the school password to continue.</p>
  </div>
  <form method="post" action="/login" novalidate>
    <label class="field" for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus {% if error %}aria-invalid="true" aria-describedby="error"{% endif %}>
    {% if error %}<p class="error" id="error" role="alert">{{ error }}</p>{% endif %}
    <label class="remember"><input type="checkbox" name="remember" value="1"> Remember this browser for 30 days</label>
    <button type="submit">Continue</button>
  </form>
  <p class="foot">For Brentwood students and staff. Meals, timetables, clubs and the rest of school life.</p>
