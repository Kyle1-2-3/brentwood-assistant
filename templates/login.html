<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Brentwood Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f11;min-height:100svh;display:grid;place-items:center;padding:28px;color:#ececee}
form{display:flex;align-items:center;width:min(100%,320px);height:58px;padding:6px;border:1px solid #303034;border-radius:14px;background:#171719;transition:border-color .18s}
form:focus-within{border-color:#68686e}
form.invalid{border-color:#c8102e}
input{min-width:0;flex:1;width:100%;height:100%;padding:0 14px;background:transparent;border:0;outline:none;color:#ececee;font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:5px}
button{display:grid;place-items:center;flex:none;width:44px;height:44px;padding:0;border:0;border-radius:9px;background:#28282c;color:#d4d4da;cursor:pointer;transition:background .18s,color .18s}
button:hover{background:#38383e;color:#fff}
button:focus-visible{outline:2px solid #96969e;outline-offset:3px}
svg{width:20px;height:20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<form method="post" action="/login" {% if error %}class="invalid"{% endif %}>
<label class="sr-only" for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="off" maxlength="256" required autofocus {% if error %}aria-invalid="true" aria-describedby="error"{% endif %}>
{% if error %}<span class="sr-only" id="error" role="alert">{{ error }}</span>{% endif %}
<button type="submit" aria-label="Continue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>
</body>
</html>
