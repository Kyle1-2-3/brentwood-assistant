<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in · Brentwood Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f11;color:#ececee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;display:grid;place-items:center;padding:28px}main{width:100%;max-width:410px}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#a5a5ae;display:flex;align-items:center;gap:12px}.eyebrow:before{content:"";width:26px;height:3px;background:#c8102e}h1{font-family:Georgia,serif;font-weight:400;font-size:46px;line-height:1.12;letter-spacing:-1.5px;margin:30px 0 18px}p{color:#a5a5ae;font-size:15px;line-height:1.7;margin:0 0 34px}label{display:block;font-size:13px;margin-bottom:10px}input{display:block;width:100%;padding:15px 16px;border:1px solid #39393e;border-radius:8px;background:#19191c;color:#fff;font:inherit}input:focus-visible,button:focus-visible{outline:2px solid #f08a99;outline-offset:4px}button{width:100%;margin-top:16px;border:0;border-radius:8px;padding:15px;background:#c8102e;color:white;font:inherit;font-weight:600;cursor:pointer}button:hover{background:#d9203d}.error{color:#ffa5b3;font-size:13px;margin:14px 0 0}.foot{border-top:1px solid #29292e;margin-top:38px;padding-top:20px;font-size:12px;color:#777780}
</style>
</head>
<body><main>
<div class="eyebrow">Brentwood Assistant</div>
<h1>School life,<br>one question away.</h1>
<p>Enter the access password to continue.</p>
<form method="post" action="/login">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus {% if error %}aria-invalid="true" aria-describedby="error"{% endif %}>
{% if error %}<p class="error" id="error" role="alert">{{ error }}</p>{% endif %}
<button type="submit">Continue <span aria-hidden="true">→</span></button>
</form>
<div class="foot">Meals, timetables, clubs &amp; the rest of school life.</div>
</main></body></html>
